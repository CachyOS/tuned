#
# tuned configuration
#

[main]
summary=CachyOS power saving profile
include=cachyos-common

[cpu]
governor=conservative|powersave
energy_perf_bias=powersave|power
energy_performance_preference=power
boost=0

[acpi]
platform_profile=low-power|quiet

[video]
radeon_powersave=dpm-battery, auto
panel_power_savings=3

[sysctl]
vm.laptop_mode=5
vm.dirty_writeback_centisecs=1500

[usb]
autosuspend=1

[audio]
timeout=10

# Reduce the number and interval of dirty pages to reduce the risk of data
# loss in case of power outage.
[vm]
dirty_bytes=5%
dirty_background_bytes=2%

[amd_x3d]
# On dual-CCD 3D V-Cache CPUs prefer the high-frequency CCD; it tends to
# be more power-efficient at lower clock speeds than the X3D CCD.
# No-op on other hardware.
mode=frequency

# [scx]
# Activate a sched-ext scheduler via scx_loader in power-saving mode.
# Requires scx_loader (org.scx.Loader) to be installed and running.
# scheduler=scx_bpfland
# mode=powersave
