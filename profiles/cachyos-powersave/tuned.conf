#
# tuned configuration
#

[main]
summary=CachyOS power saving profile
include=powersave

[amd_x3d]
# On dual-CCD 3D V-Cache CPUs prefer the high-frequency CCD; it tends to
# be more power-efficient at lower clock speeds than the X3D CCD.
# No-op on other hardware.
mode=frequency

[sysctl]
# CachyOS uses zram+zstd by default; higher swappiness works better
# with compressed in-memory swap than with slow disk-based swap
vm.swappiness=133
