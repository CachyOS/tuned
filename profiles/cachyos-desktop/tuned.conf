#
# tuned configuration
#

[main]
summary=CachyOS optimized desktop profile
include=cachyos-common

[cpu]
governor=schedutil|powersave
energy_perf_bias=normal
energy_performance_preference=balance_performance

[video]
radeon_powersave=dpm-balanced, auto
panel_power_savings=0
dpm_perf_level=auto

[amd_x3d]
# On dual-CCD 3D V-Cache CPUs prefer the high-frequency CCD for general
# desktop use where clock speed matters more than raw cache capacity.
# No-op on other hardware.
mode=frequency

# [scx]
# Activate a sched-ext scheduler via scx_loader for improved desktop
# responsiveness.  Requires scx_loader (org.scx.Loader) to be installed
# and running.
# scheduler=scx_bpfland
# mode=auto
