#
# tuned configuration
#

[main]
summary=CachyOS optimized desktop profile
include=balanced

[vm]
# Use THP only where applications request it (madvise) rather than
# system-wide to avoid overhead in workloads that don't benefit
transparent_hugepages=madvise

[sysctl]
# Improve desktop responsiveness by grouping tasks in the same session
kernel.sched_autogroup_enabled=1

# Most CachyOS desktop systems are single-socket; NUMA balancing
# only adds overhead without benefit on these systems
kernel.numa_balancing=0

# CachyOS uses zram+zstd by default; higher swappiness works better
# with compressed in-memory swap than with slow disk-based swap
vm.swappiness=133

# Reduce background memory compaction to avoid latency spikes
vm.compaction_proactiveness=0
