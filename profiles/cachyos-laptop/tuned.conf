#
# tuned configuration
#

[main]
summary=CachyOS battery-optimized laptop profile
include=balanced-battery

[amd_x3d]
# On dual-CCD 3D V-Cache CPUs prefer the high-frequency CCD; it is also
# typically the more power-efficient option on battery.  No-op on other
# hardware.
mode=frequency

[sysctl]
# CachyOS uses zram+zstd by default; higher swappiness works better
# with compressed in-memory swap than with slow disk-based swap
vm.swappiness=133

# Reduce background memory compaction to avoid latency spikes
vm.compaction_proactiveness=0
