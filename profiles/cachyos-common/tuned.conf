#
# tuned configuration
#

[main]
summary=CachyOS common profile

[vm]
# THP=always maps all anonymous allocations to huge pages system-wide,
# which reduces TLB pressure and benefits games with large heaps
# (e.g., AAA titles, Wine/Proton workloads, game engines).  The trade-off
# is that khugepaged must scan and collapse pages in the background, which
# can introduce occasional latency spikes on memory-intensive workloads.
#
# THP=madvise is the safer conservative choice: only processes that
# explicitly opt in via madvise(MADV_HUGEPAGE) receive huge pages.
# Wine/Proton and many game engines do issue these hints, so most games
# still benefit without the system-wide overhead.
#
# For a pure gaming rig "always" is generally the better pick;
# for a mixed gaming/workstation use "madvise".
transparent_hugepages=always

# Improve performance for applications that use tcmalloc
# https://github.com/google/tcmalloc/blob/master/docs/tuning.md#system-level-optimizations
transparent_hugepage.defrag=defer+madvise

# Keep dirty thresholds low to avoid large writeback stalls during gameplay;
# suitable for fast NVMe storage
dirty_bytes=10%
dirty_background_bytes=3%

[sysctl]
# Additionally disabling watchdog timers increases performance and lowers power
# consumption
kernel.nmi_watchdog=0

# The sysctl swappiness parameter determines the kernel's preference for
# pushing anonymous pages or page cache to disk in memory-starved situations. A
# low value causes the kernel to prefer freeing up open files (page cache), a
# high value causes the kernel to try to use swap space, and a value of 100
# means IO cost is assumed to be equal.
vm.swappiness=100

# page-cluster controls the number of pages up to which consecutive pages are
# read in from swap in a single attempt. This is the swap counterpart to page
# cache readahead. The mentioned consecutivity is not in terms of
# virtual/physical addresses, but consecutive on swap space - that means they
# were swapped out together. (Default is 3) increase this value to 1 or 2 if
# you are using physical swap (1 if ssd, 2 if hdd)
vm.page-cluster=0

# The value controls the tendency of the kernel to reclaim the memory which is
# used for caching of directory and inode objects (VFS cache). Lowering it from
# the default value of 100 makes the kernel less inclined to reclaim VFS cache
# (do not set it to 0, this may produce out-of-memory conditions)
vm.vfs_cache_pressure=50

# The kernel flusher threads will periodically wake up and write old data out
# to disk.  This tunable expresses the interval between those wakeups, in
# 100'ths of a second (Default is 500).
vm.dirty_expire_centisecs=1500

# Reduce background memory compaction to avoid latency spikes
vm.compaction_proactiveness=0

[sysctl-zram]
type=sysctl
devices=zram*
vm.swappiness=150

[disk-sd]
type=disk
devices=sd*
elevator=mq-deadline

[disk-nvme]
type=disk
devices=nvme*
elevator=kyber
