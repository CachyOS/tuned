#
# tuned configuration
#

[main]
summary=CachyOS gaming and high-performance desktop profile
include=cachyos-common

[cpu]
governor=performance
energy_perf_bias=performance
energy_performance_preference=performance
min_perf_pct=100
boost=1

[acpi]
platform_profile=performance

[video]
radeon_powersave=dpm-performance
panel_power_savings=0
dpm_perf_level=profile_peak

[usb]
autosuspend=0

[audio]
timeout=0

[amd_x3d]
# On dual-CCD 3D V-Cache CPUs (e.g. 7950X3D, 9950X3D) prefer the X3D CCD
# to maximise the available L3 cache for games.  No-op on other hardware.
mode=cache

# [scx]
# Activate a sched-ext scheduler via scx_loader for low-latency gaming.
# Requires scx_loader (org.scx.Loader) to be installed and running.
# scheduler=scx_lavd
# mode=gaming
