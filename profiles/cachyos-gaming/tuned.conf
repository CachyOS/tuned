#
# tuned configuration
#

[main]
summary=CachyOS gaming and high-performance desktop profile

[cpu]
governor=performance
energy_perf_bias=performance
energy_performance_preference=performance
min_perf_pct=100
boost=1
scaling_min_freq=amd_pstate_lowest_nonlinear_freq

[acpi]
platform_profile=performance

[vm]
# THP=always maps all anonymous allocations to huge pages system-wide,
# which reduces TLB pressure and benefits games with large heaps
# (e.g., AAA titles, Wine/Proton workloads, game engines).  The trade-off
# is that khugepaged must scan and collapse pages in the background, which
# can introduce occasional latency spikes on memory-intensive workloads.
#
# THP=madvise is the safer conservative choice: only processes that
# explicitly opt in via madvise(MADV_HUGEPAGE) receive huge pages.
# Wine/Proton and many game engines do issue these hints, so most games
# still benefit without the system-wide overhead.
#
# For a pure gaming rig "always" is generally the better pick;
# for a mixed gaming/workstation use "madvise".
transparent_hugepages=always

# Keep dirty thresholds low to avoid large writeback stalls during gameplay;
# suitable for fast NVMe storage
dirty_bytes=10%
dirty_background_bytes=3%

[sysctl]
# Improve responsiveness by grouping tasks in the same session
kernel.sched_autogroup_enabled=1

# Most CachyOS desktop systems are single-socket; disable NUMA balancing
kernel.numa_balancing=0

# CachyOS uses zram+zstd by default; higher swappiness works better
# with compressed in-memory swap than with slow disk-based swap
vm.swappiness=133

# Reduce background memory compaction to avoid latency spikes
vm.compaction_proactiveness=0

[video]
panel_power_savings=0

[amd_x3d]
# On dual-CCD 3D V-Cache CPUs (e.g. 7950X3D, 9950X3D) prefer the X3D CCD
# to maximise the available L3 cache for games.  No-op on other hardware.
mode=cache

# [scx]
# Activate a sched-ext scheduler via scx_loader for low-latency gaming.
# Requires scx_loader (org.scx.Loader) to be installed and running.
# scheduler=scx_lavd
# mode=gaming
